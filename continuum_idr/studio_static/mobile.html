<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101c">
  <title>Continuum Driver View</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body{overflow:hidden;background:#07101c}.driver-shell{height:100dvh;position:relative;display:flex;flex-direction:column;background:#091522}.driver-top{position:absolute;z-index:5;top:max(16px,env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:center;justify-content:space-between}.driver-brand{display:flex;align-items:center;gap:9px;background:rgba(7,16,28,.86);border:1px solid var(--line);border-radius:11px;padding:8px 10px;backdrop-filter:blur(15px);font-size:11px;font-weight:750}.driver-brand .brand-mark{width:24px;height:24px;padding:5px}.driver-link{font-size:9px;text-decoration:none;color:#cbd8e5;background:rgba(7,16,28,.86);border:1px solid var(--line);border-radius:9px;padding:9px 10px;backdrop-filter:blur(15px)}
    .driver-map{position:absolute;inset:0;width:100%;height:100%}.driver-state{position:absolute;z-index:5;top:max(72px,calc(env(safe-area-inset-top) + 62px));left:14px;right:14px;padding:13px 14px;border-radius:13px;background:rgba(8,17,29,.9);border:1px solid var(--line);backdrop-filter:blur(18px);display:flex;gap:11px;align-items:center}.driver-state>i{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 13px var(--green);flex:none}.driver-state.outage>i{background:var(--amber);box-shadow:0 0 13px var(--amber)}.driver-state.recovery>i{background:var(--blue);box-shadow:0 0 13px var(--blue)}.driver-state strong,.driver-state span{display:block}.driver-state strong{font-size:12px}.driver-state span{font-size:9px;color:var(--muted);margin-top:3px}
    .driver-card{position:absolute;z-index:6;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));background:rgba(10,21,35,.95);border:1px solid var(--line);border-radius:18px;padding:17px;backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,.42)}.driver-primary{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line-soft)}.driver-speed span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.driver-speed strong{font-size:42px;letter-spacing:-.06em}.driver-speed small{font-size:10px;color:var(--muted)}.driver-mode{text-align:right}.driver-mode span,.driver-mode strong{display:block}.driver-mode span{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.driver-mode strong{font-size:12px;margin-top:4px;color:var(--green)}
    .driver-metrics{display:grid;grid-template-columns:repeat(3,1fr);padding:14px 0}.driver-metrics>div{border-left:1px solid var(--line-soft);padding:0 10px}.driver-metrics>div:first-child{border-left:0;padding-left:0}.driver-metrics span,.driver-metrics strong{display:block}.driver-metrics span{font-size:8px;color:var(--faint);margin-bottom:4px}.driver-metrics strong{font-size:11px}.driver-controls{display:grid;grid-template-columns:1fr auto;gap:8px}.driver-controls button{border:1px solid #3597ef;background:#237acc;color:#fff;border-radius:9px;padding:11px;font-size:10px;font-weight:750;cursor:pointer}.driver-controls button:last-child{width:42px;background:#142338;border-color:var(--line)}.replay-disclosure{text-align:center;font-size:8px;color:var(--faint);margin:10px 0 0;line-height:1.4}
    @media(min-width:700px){body{display:grid;place-items:center;background:radial-gradient(circle at top,#1a3455,#07101c 55%)}.driver-shell{width:430px;height:min(880px,94vh);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 35px 100px rgba(0,0,0,.55)}}
  </style>
</head>
<body>
  <main class="driver-shell">
    <canvas class="driver-map" id="driver-map"></canvas>
    <header class="driver-top"><div class="driver-brand"><span class="brand-mark"><i></i><i></i><i></i></span>Continuum</div><a class="driver-link" href="/">Open Studio ↗</a></header>
    <section class="driver-state" id="driver-state"><i></i><div><strong id="driver-message">Preparing replay</strong><span id="driver-submessage">Waiting for the shared Studio session.</span></div></section>
    <section class="driver-card">
      <div class="driver-primary"><div class="driver-speed"><span>Estimated speed</span><strong id="driver-speed">—</strong> <small>KM/H</small></div><div class="driver-mode"><span>Navigation mode</span><strong id="driver-mode">—</strong></div></div>
      <div class="driver-metrics"><div><span>Heading</span><strong id="driver-heading">—</strong></div><div><span>Uncertainty</span><strong id="driver-uncertainty">—</strong></div><div><span>GNSS</span><strong id="driver-gnss">—</strong></div></div>
      <div class="driver-controls"><button id="driver-play">Start synchronized replay</button><button id="driver-reset" aria-label="Restart replay">↺</button></div>
      <p class="replay-disclosure">Recorded IO-VNBD evaluation replay · estimator executed on the documented desktop runtime</p>
    </section>
  </main>
  <script src="/static/mobile.js"></script>
</body>
</html>
