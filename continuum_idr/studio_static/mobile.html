<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d16">
  <title>Continuum IDR — Driver Navigation Readout</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body {
      overflow-x: hidden;
      background: #080d16;
      margin: 0;
      padding: 0;
    }

    @media (min-width: 600px) {
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: radial-gradient(circle at 50% 20%, #15253d, #080d16 65%);
        padding: 20px;
      }
    }

    .mobile-frame {
      width: 100%;
      min-height: 100dvh;
      background: #0b121e;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    @media (min-width: 600px) {
      .mobile-frame {
        width: 390px;
        min-height: 820px;
        height: 820px;
        border: 2px solid #1e2d42;
        border-radius: 36px;
        overflow: hidden;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6);
      }
    }

    /* Top Bar */
    .mobile-topbar {
      padding: max(14px, env(safe-area-inset-top)) 16px 10px;
      background: rgba(11, 18, 30, 0.94);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .mobile-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .mobile-brand span {
      color: var(--blue);
    }

    .btn-return-studio {
      font-size: 11px;
      color: var(--text-muted);
      border: 1px solid var(--line);
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--surface);
    }

    /* Trajectory Canvas */
    .mobile-canvas-wrap {
      flex: 1;
      min-height: 240px;
      position: relative;
      background: #070c14;
    }

    #driver-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .canvas-overlay-mode {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 5;
    }

    /* Driver HUD Card */
    .hud-card {
      background: var(--surface);
      border-top: 1px solid var(--line);
      padding: 16px 18px max(18px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .hud-hero {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .hud-speed {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .hud-speed-val {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text-bright);
      line-height: 1;
    }

    .hud-speed-unit {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .hud-compass {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .hud-compass-deg {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .hud-compass-cardinal {
      font-size: 11px;
      color: var(--text-faint);
      text-transform: uppercase;
    }

    .hud-metric-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 10px 0;
      border-top: 1px solid var(--line-subtle);
      border-bottom: 1px solid var(--line-subtle);
    }

    .hud-metric-item {
      display: flex;
      flex-direction: column;
    }

    .hud-metric-item span {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-faint);
    }

    .hud-metric-item strong {
      font-size: 12px;
      color: var(--text);
      margin-top: 2px;
    }

    /* Shared Controls */
    .hud-controls {
      display: grid;
      grid-template-columns: 1fr 1fr 44px;
      gap: 8px;
    }

    .hud-btn {
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 10px 8px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .hud-btn.primary {
      background: var(--blue);
      border-color: var(--blue-hover);
      color: #ffffff;
    }

    .hud-btn.withheld {
      background: var(--amber-faint);
      border-color: var(--amber-border);
      color: var(--amber);
    }

    .hud-btn.icon-only {
      padding: 0;
      font-size: 14px;
    }

    .shared-notice {
      font-size: 9px;
      color: var(--text-faint);
      text-align: center;
      line-height: 1.4;
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="mobile-frame">
    <!-- Header -->
    <header class="mobile-topbar">
      <div class="mobile-brand">
        <div class="brand-mark" style="width:20px;height:20px;padding:3px;" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
        </div>
        <div>Continuum <span>Driver</span></div>
      </div>
      <a class="btn-return-studio" href="/">Studio ↗</a>
    </header>

    <!-- Mini Metric Trajectory Map -->
    <div class="mobile-canvas-wrap" id="driver-canvas-container">
      <canvas id="driver-canvas"></canvas>
      <div class="canvas-overlay-mode">
        <span class="mode-pill uninitialized" id="driver-mode-pill">UNINITIALIZED</span>
      </div>
    </div>

    <!-- HUD Readout -->
    <div class="hud-card">
      <div class="hud-hero">
        <div class="hud-speed">
          <span class="hud-speed-val" id="driver-speed">0</span>
          <span class="hud-speed-unit">KM/H</span>
        </div>
        <div class="hud-compass">
          <span class="hud-compass-deg" id="driver-heading">—°</span>
          <span class="hud-compass-cardinal" id="driver-cardinal">HEADING</span>
        </div>
      </div>

      <div class="hud-metric-row">
        <div class="hud-metric-item">
          <span>Uncertainty</span>
          <strong id="driver-uncertainty">±— m</strong>
        </div>
        <div class="hud-metric-item">
          <span>GPS Input</span>
          <strong id="driver-gps-status">Delivering</strong>
        </div>
        <div class="hud-metric-item">
          <span>Runtime Elapsed</span>
          <strong id="driver-elapsed">00:00.0</strong>
        </div>
      </div>

      <!-- Shared Control Strip -->
      <div class="hud-controls">
        <button class="hud-btn primary" id="driver-btn-play" type="button">
          <span id="driver-play-icon">▶</span>
          <span id="driver-play-label">Start Engine</span>
        </button>

        <button class="hud-btn" id="driver-btn-gnss" type="button">
          <span>⌁</span>
          <span id="driver-gnss-label">Withhold GPS</span>
        </button>

        <button class="hud-btn icon-only" id="driver-btn-restart" type="button" title="Restart Session">
          ↺
        </button>
      </div>

      <p class="shared-notice">
        Recorded IO-VNBD Sensor Demo · Shared session synchronously reflected in Studio.
      </p>
    </div>
  </main>

  <script src="/static/mobile.js"></script>
</body>
</html>
